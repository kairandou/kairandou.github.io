name: Get Citation Data

on:
  workflow_dispatch:
  page_build:
  push:
    branches: [main]
    paths:
      - "google_scholar_crawler/**"
      - ".github/workflows/google_scholar_crawler.yaml"
      - "_data/publications.yml"
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Verify snapshot validation
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py'
      - name: Fetch citations
        env:
          GOOGLE_SCHOLAR_ID: ${{ vars.GOOGLE_SCHOLAR_ID || secrets.GOOGLE_SCHOLAR_ID || 'tWcg0ZsAAAAJ' }}
        run: python google_scholar_crawler/main.py --output-dir "$RUNNER_TEMP/scholar-results"
      - name: Save citation snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin google-scholar-stats > /dev/null; then
            git fetch origin google-scholar-stats
            git switch --detach FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git switch --orphan google-scholar-stats
          fi
          cp "$RUNNER_TEMP/scholar-results/gs_data.json" gs_data.json
          cp "$RUNNER_TEMP/scholar-results/gs_data_shieldsio.json" gs_data_shieldsio.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Google Scholar citation data"
          git push origin HEAD:google-scholar-stats
