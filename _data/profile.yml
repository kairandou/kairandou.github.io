bio:
  - >-
    Hi, I'm Kairan Dou (窦楷然).
    I will join [Carnegie Mellon University](https://www.cmu.edu/) as a graduate student
    in January 2027. Previously, I spent six months as an Embodied AI Algorithm Intern
    at [Meituan](https://www.meituan.com/), working on embodied AI post-training
    and data processing for pre-training.
  - >-
    I completed my undergraduate studies at
    [Nankai University](https://www.nankai.edu.cn/) and was an exchange student at
    [UC Berkeley](https://www.berkeley.edu/).
