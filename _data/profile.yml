bio:
  - >-
    Hi, I'm Kairan Dou (Kevin). I am an Embodied AI Data Intern at
    [ByteDance Seed](https://seed.bytedance.com/), and previously worked as an
    Embodied AI Algorithm Intern at [Meituan](https://www.meituan.com/).
  - >-
    I will join [Carnegie Mellon University](https://www.cmu.edu/) as a graduate student
    in January 2027. I completed my undergraduate studies at
    [Nankai University](https://www.nankai.edu.cn/) and was an exchange student at
    [UC Berkeley](https://www.berkeley.edu/).
